name: Build and Release Firmware

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install PlatformIO and esptool
        run: |
          python -m pip install --upgrade pip
          pip install platformio esptool

      - name: Build firmware with PlatformIO
        working-directory: firmware
        run: |
          pio run

      - name: Generate Factory All-in-One Binary (offset 0x0)
        working-directory: firmware
        run: |
          python -m esptool --chip esp32 merge_bin \
            -o wazehud_cyd_factory_all_in_one_0x0.bin \
            --flash_mode dio \
            --flash_freq 40m \
            --flash_size 4MB \
            0x1000 .pio/build/esp32dev/bootloader.bin \
            0x8000 .pio/build/esp32dev/partitions.bin \
            0x10000 .pio/build/esp32dev/firmware.bin

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wazehud-cyd-binaries
          path: |
            firmware/wazehud_cyd_factory_all_in_one_0x0.bin
            firmware/.pio/build/esp32dev/firmware.bin

      - name: Prepare Release Name & Tag
        id: release_info
        run: |
          TAG="v1.0.$(date +'%Y%m%d%H%M%S')"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "name=Release $TAG" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.name }}
          draft: false
          prerelease: false
          files: |
            firmware/wazehud_cyd_factory_all_in_one_0x0.bin
            firmware/.pio/build/esp32dev/firmware.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up old releases (keep only latest 3)
        uses: dev-drprasad/delete-older-releases@v0.3.3
        with:
          keep_latest: 3
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
